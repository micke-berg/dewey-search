name: Release tarball
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm audit --audit-level=high
      - run: npm run release:check
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm ci && npm run build
      - name: Check the package for private words
        env:
          PUBLIC_GUARD_LIST_TEXT: ${{ secrets.PUBLIC_GUARD_LIST }}
        run: python3 .github/public-guard.py pack
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Checksum and upload
        working-directory: ${{ runner.temp }}
        run: |
          sha256sum micke-berg-dewey-*.tgz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Dewey $GITHUB_REF_NAME" --generate-notes micke-berg-dewey-*.tgz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
